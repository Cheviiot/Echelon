app-id: io.github.cheviiot.Echelon
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: echelon-wrapper.sh

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/.Echelon:create

modules:
  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_BUILD_TESTS=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/g-truc/glm.git
        tag: 1.0.1

  - name: gli
    buildsystem: cmake-ninja
    config-opts:
      - -DGLI_TEST_ENABLE=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/g-truc/gli.git
        branch: master

  - name: echelon
    buildsystem: simple
    build-commands:
      - |
        cmake -S . -B build-flatpak -G Ninja \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DRTS_BUILD_ZEROHOUR=ON \
          -DRTS_BUILD_GENERALS=ON \
          -DRTS_BUILD_UNIVERSAL_LAUNCHER=ON \
          -DRTS_BUILD_CORE_TOOLS=OFF \
          -DRTS_BUILD_CORE_EXTRAS=OFF \
          -DRTS_BUILD_GENERALS_TOOLS=OFF \
          -DRTS_BUILD_GENERALS_EXTRAS=OFF \
          -DRTS_BUILD_ZEROHOUR_TOOLS=OFF \
          -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF \
          -DRTS_BUILD_OPTION_DEBUG=OFF \
          -DRTS_BUILD_OPTION_PROFILE=OFF \
          -DRTS_BUILD_OPTION_FFMPEG=ON \
          -DRTS_CRASHDUMP_ENABLE=OFF \
          -DSAGE_USE_DX8=OFF \
          -DSAGE_USE_SDL3=ON \
          -DSAGE_USE_OPENAL=ON \
          -DSAGE_USE_GLM=ON \
          -DSAGE_UPDATE_CHECK=ON \
          -DRTS_BUILD_OPTION_SAGE_PATCH=ON \
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
          -DFETCHCONTENT_SOURCE_DIR_DXVK=/run/build/echelon/dxvk-src \
          -DFETCHCONTENT_SOURCE_DIR_SDL3=/run/build/echelon/sdl3-src \
          -DFETCHCONTENT_SOURCE_DIR_SDL3_IMAGE=/run/build/echelon/sdl3-image-src \
          -DFETCHCONTENT_SOURCE_DIR_OPENAL_SOFT=/run/build/echelon/openal-soft-src \
          -DFETCHCONTENT_SOURCE_DIR_GAMESPY=/run/build/echelon/gamespy-src \
          -DFETCHCONTENT_SOURCE_DIR_LZHL=/run/build/echelon/lzhl-src/CompLibHeader \
          -DFETCHCONTENT_SOURCE_DIR_GAMEMATH=/run/build/echelon/gamemath-src \
          -DFETCHCONTENT_SOURCE_DIR_STB=/run/build/echelon/stb-src \
          -DFETCHCONTENT_SOURCE_DIR_YAML_CPP=/run/build/echelon/yaml-cpp-src \
          -DFETCHCONTENT_SOURCE_DIR_LIBARCHIVE=/run/build/echelon/libarchive-src
      - cmake --build build-flatpak --target echelon_launcher -j "${FLATPAK_BUILDER_N_JOBS:-4}"
      - cmake --build build-flatpak --target echelon_settings_tests -j "${FLATPAK_BUILDER_N_JOBS:-4}"
      - build-flatpak/Launcher/echelon_settings_tests
      - cmake --build build-flatpak --target sage_patch -j "${FLATPAK_BUILDER_N_JOBS:-4}" || true
      - install -Dm755 build-flatpak/Echelon/Echelon /app/bin/Echelon
      - install -Dm755 build-flatpak/Echelon/libEchelonGeneralsEngine.so /app/lib/echelon/libEchelonGeneralsEngine.so
      - install -Dm755 build-flatpak/Echelon/libEchelonZeroHourEngine.so /app/lib/echelon/libEchelonZeroHourEngine.so
      - install -Dm755 flatpak/run-flatpak-echelon.sh /app/bin/echelon-wrapper.sh
      - install -Dm644 flatpak/io.github.cheviiot.Echelon.desktop /app/share/applications/io.github.cheviiot.Echelon.desktop
      - install -Dm644 flatpak/io.github.cheviiot.Echelon.metainfo.xml /app/share/metainfo/io.github.cheviiot.Echelon.metainfo.xml
      - install -Dm644 flatpak/io.github.cheviiot.Echelon.png /app/share/icons/hicolor/512x512/apps/io.github.cheviiot.Echelon.png
      - install -Dm644 assets/launcher/echelon-launcher-background.png /app/share/echelon/echelon-launcher-background.png
      - install -Dm644 assets/launcher/echelon-logo.png /app/share/echelon/echelon-logo.png
      - install -Dm644 assets/launcher/fonts/DejaVuSans.ttf /app/share/echelon/DejaVuSans.ttf
      - install -Dm644 assets/launcher/fonts/LICENSE /app/share/licenses/echelon/DejaVuSans-LICENSE
      - install -Dm644 yaml-cpp-src/LICENSE /app/share/licenses/echelon/yaml-cpp-LICENSE
      - install -Dm644 libarchive-src/COPYING /app/share/licenses/echelon/libarchive-COPYING
      - install -Dm644 resources/dxvk/dxvk.conf /app/share/echelon/dxvk.conf
      - install -d /app/lib
      - cp -a /run/build/echelon/dxvk-src/lib/libdxvk_d3d8.so* /app/lib/
      - cp -a /run/build/echelon/dxvk-src/lib/libdxvk_d3d9.so* /app/lib/
      - if [ -d build-flatpak/_deps/sdl3-build ]; then cp -a build-flatpak/_deps/sdl3-build/libSDL3.so* /app/lib/; fi
      - if [ -d build-flatpak/_deps/sdl3_image-build ]; then cp -a build-flatpak/_deps/sdl3_image-build/libSDL3_image.so* /app/lib/; fi
      - if [ -d build-flatpak/_deps/openal_soft-build ]; then cp -a build-flatpak/_deps/openal_soft-build/libopenal.so* /app/lib/; fi
      - find build-flatpak -name "libgamespy.so*" -type f -exec cp -a {} /app/lib/ \;
      - if [ -f build-flatpak/Patches/SagePatch/libsage_patch.so ]; then cp -a build-flatpak/Patches/SagePatch/libsage_patch.so /app/lib/; fi
      - |
        for f in /app/lib/lib*.so.*; do
          b="$(basename "$f")"
          if [[ "$b" =~ ^(lib[^.]+\.so)\.([0-9]+)(\..*)?$ ]]; then
            if [[ -n "${BASH_REMATCH[3]}" ]]; then
              ln -sf "$b" "/app/lib/${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
          fi
        done
      - |
        cat > /app/bin/run.sh <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ -n "${LD_LIBRARY_PATH:-}" ]]; then
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:/app/lib"
        else
          export LD_LIBRARY_PATH="/app/lib"
        fi

        export DXVK_WSI_DRIVER="SDL3"
        export DXVK_LOG_LEVEL="${DXVK_LOG_LEVEL:-info}"
        export DXVK_HUD="${DXVK_HUD:-0}"

        sage_patch_preload="${LD_PRELOAD:-}"
        if [[ -f /app/lib/libsage_patch.so && "${SAGE_PATCH_DISABLED:-0}" != "1" ]]; then
          if [[ -n "${LD_PRELOAD:-}" ]]; then
            sage_patch_preload="/app/lib/libsage_patch.so:${LD_PRELOAD}"
          else
            sage_patch_preload="/app/lib/libsage_patch.so"
          fi
        fi

        if [[ -z "${ALSOFT_DISABLE_CPU_EXTS:-}" ]]; then
          export ALSOFT_DISABLE_CPU_EXTS="all"
        fi
        if [[ -z "${ALSOFT_DRIVERS:-}" ]]; then
          export ALSOFT_DRIVERS="pulse,alsa,oss,jack,null,wave"
        fi

        LD_PRELOAD="${sage_patch_preload}" /app/bin/Echelon "$@" 2>&1 | grep --line-buffered -v "Unimplemented render state D3DRS_PATCHSEGMENTS" | grep --line-buffered -v "No accelerated colorspace conversion"
        exit ${PIPESTATUS[0]}
        EOF
      - chmod +x /app/bin/run.sh
    sources:
      - type: dir
        path: ..
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.2/SDL3-3.4.2.tar.gz
        sha256: ef39a2e3f9a8a78296c40da701967dd1b0d0d6e267e483863ce70f8a03b4050c
        dest: sdl3-src
        strip-components: 1
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-3.4.0/SDL3_image-3.4.0.tar.gz
        sha256: 2ceb75eab4235c2c7e93dafc3ef3268ad368ca5de40892bf8cffdd510f29d9d8
        dest: sdl3-image-src
        strip-components: 1
      - type: archive
        url: https://github.com/kcat/openal-soft/archive/refs/tags/1.24.2.tar.gz
        sha256: 7efd383d70508587fbc146e4c508771a2235a5fc8ae05bf6fe721c20a348bd7c
        dest: openal-soft-src
        strip-components: 1
      - type: archive
        url: https://github.com/doitsujin/dxvk/releases/download/v2.6/dxvk-native-2.6-steamrt-sniper.tar.gz
        sha256: 9c1a2b2c8a6565e71bde5f18b6c1a7e0ac4d621023bd38004a421a5fef4212ac
        dest: dxvk-src
        strip-components: 1
      - type: git
        url: https://github.com/TheAssemblyArmada/GamespySDK.git
        commit: 07e3d15c500415abc281efb74322ab6d9c857eb8
        dest: gamespy-src
      - type: git
        url: https://github.com/TheSuperHackers/lzhl-1.0
        commit: dfd96e2ca64adaddb35dd4ebadd6add7d5586783
        dest: lzhl-src/CompLibHeader
      - type: git
        url: https://github.com/TheSuperHackers/GameMath.git
        commit: 59f7ccd494f7e7c916a784ac26ef266f9f09d78d
        dest: gamemath-src
      - type: git
        url: https://github.com/TheSuperHackers/stb.git
        commit: 5c205738c191bcb0abc65c4febfa9bd25ff35234
        dest: stb-src
      - type: git
        url: https://github.com/jbeder/yaml-cpp.git
        commit: 56e3bb550c91fd7005566f19c079cb7a503223cf
        dest: yaml-cpp-src
      - type: git
        url: https://github.com/libarchive/libarchive.git
        commit: 27cbc7827172698143e440801fc0ba39ccb4f1f5
        dest: libarchive-src
