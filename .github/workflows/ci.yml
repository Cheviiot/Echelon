name: Echelon CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zh-should-build: ${{ steps.filter.outputs.zh-should-build }}
      base-should-build: ${{ steps.filter.outputs.base-should-build }}
      replay-assets-available: ${{ steps.assets.outputs.available }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            zh-should-build:
              - 'GeneralsX/**'
              - 'Launcher/**'
              - 'EngineIntegration/**'
              - 'assets/**'
              - 'flatpak/**'
              - 'scripts/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/build-*.yml'
              - '.github/workflows/replay-tests*.yml'
              - '.github/workflows/ci.yml'
            base-should-build:
              - 'GeneralsX/**'
              - 'Launcher/**'
              - 'EngineIntegration/**'
              - 'assets/**'
              - 'flatpak/**'
              - 'scripts/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.github/workflows/build-*.yml'
              - '.github/workflows/replay-tests*.yml'
              - '.github/workflows/ci.yml'

      - name: Check replay asset availability
        id: assets
        env:
          REPLAY_ASSETS_KEY: ${{ secrets.ASSETS_KEY }}
        run: |
          if [ -n "$REPLAY_ASSETS_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Replay tests skipped: ASSETS_KEY is not configured for this run. CRC compatibility is not verified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Trigger Summary
        run: |
          echo "### 🔍 CI Trigger (Granular)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.filter.outputs.zh-should-build }}" = "true" ]; then
            echo "| Echelon: Zero Hour engine (GeneralsMD) | ✅ Changes detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Echelon: Zero Hour engine (GeneralsMD) | ⏭️ No changes |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.filter.outputs.base-should-build }}" = "true" ]; then
            echo "| Echelon: Generals engine (Generals) | ✅ Changes detected |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Echelon: Generals engine (Generals) | ⏭️ No changes |" >> $GITHUB_STEP_SUMMARY
          fi

  build-linux-flatpak:
    name: Build Linux Flatpak
    needs: detect-changes
    if: needs.detect-changes.outputs.zh-should-build == 'true' || needs.detect-changes.outputs.base-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-linux-flatpak.yml
    with:
      preset: linux64-deploy
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: detect-changes
    if: needs.detect-changes.outputs.zh-should-build == 'true' || needs.detect-changes.outputs.base-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-macos.yml
    with:
      preset: macos-vulkan
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: detect-changes
    if: needs.detect-changes.outputs.zh-should-build == 'true' || needs.detect-changes.outputs.base-should-build == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  replay-test-linux:
    name: Replay Tests (linux)
    needs: [detect-changes, build-linux-flatpak]
    if: needs.build-linux-flatpak.result == 'success' && needs.detect-changes.outputs.replay-assets-available == 'true'
    uses: ./.github/workflows/replay-tests.yml
    with:
      platform: linux-flatpak
      game-artifact: linux-flatpak-echelon-linux64-deploy
    secrets:
      ASSETS_KEY: ${{ secrets.ASSETS_KEY }}

  replay-test-macos:
    name: Replay Tests (macos)
    needs: [detect-changes, build-macos]
    if: needs.build-macos.result == 'success' && needs.detect-changes.outputs.replay-assets-available == 'true'
    uses: ./.github/workflows/replay-tests.yml
    with:
      platform: macos
      game-artifact: macos-echelon-app
    secrets:
      ASSETS_KEY: ${{ secrets.ASSETS_KEY }}

  replay-test-windows:
    name: Replay Tests (windows)
    needs: [detect-changes, build-windows]
    if: needs.build-windows.result == 'success' && needs.detect-changes.outputs.replay-assets-available == 'true'
    uses: ./.github/workflows/replay-tests-windows.yml
    with:
      game-artifact: generalsxzh-windows-x86-replay-test-only
    secrets:
      ASSETS_KEY: ${{ secrets.ASSETS_KEY }}

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-linux-flatpak, build-macos, build-windows, replay-test-linux, replay-test-macos, replay-test-windows]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "### Echelon Multi-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux Flatpak | ${{ needs.build-linux-flatpak.result == 'success' && '✅ Success' || needs.build-linux-flatpak.result == 'skipped' && '⏭️ Skipped' || needs.build-linux-flatpak.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS (arm64) | ${{ needs.build-macos.result == 'success' && '✅ Success' || needs.build-macos.result == 'skipped' && '⏭️ Skipped' || needs.build-macos.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (x86) | ${{ needs.build-windows.result == 'success' && '✅ Success' || needs.build-windows.result == 'skipped' && '⏭️ Skipped' || needs.build-windows.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Replay Tests | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux ZH replays | ${{ needs.replay-test-linux.result == 'success' && '✅ Pass' || needs.replay-test-linux.result == 'skipped' && '⏭️ Skipped' || needs.replay-test-linux.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS ZH replays | ${{ needs.replay-test-macos.result == 'success' && '✅ Pass' || needs.replay-test-macos.result == 'skipped' && '⏭️ Skipped' || needs.replay-test-macos.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows ZH replays (Linux + macOS captures) | ${{ needs.replay-test-windows.result == 'success' && '✅ Pass' || needs.replay-test-windows.result == 'skipped' && '⏭️ Skipped' || needs.replay-test-windows.result == 'cancelled' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if Any Build or Replay Test Failed
        if: |
          needs.detect-changes.result == 'failure' ||
          needs.build-linux-flatpak.result == 'failure' ||
          needs.build-macos.result == 'failure' ||
          needs.build-windows.result == 'failure' ||
          needs.replay-test-linux.result == 'failure' ||
          needs.replay-test-macos.result == 'failure' ||
          needs.replay-test-windows.result == 'failure'
        run: exit 1
